spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jackson.deserialization.fail-on-unknown-properties=true
token.secret=${TOKEN_SECRET}
token.expiration-seconds=${TOKEN_EXPIRATION_SECONDS:86400}
session.expiration-seconds=${SESSION_EXPIRATION_SECONDS:86400}
geoip.api.base-url=${GEOIP_API_BASE_URL:http://ip-api.com/json}
token.challenge-expiration-seconds=${TOKEN_CHALLENGE_EXPIRATION_SECONDS:300}
security.email-verification.expiration-seconds=${SECURITY_EMAIL_VERIFICATION_EXPIRATION_SECONDS:86400}
security.otp.expiration-seconds=${SECURITY_OTP_EXPIRATION_SECONDS:300}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:${server.port}}
gmail.client-id=${GMAIL_CLIENT_ID:${GOOGLE_CLIENT_ID:${GMAIL_OAUTH_CLIENT_ID:}}}
gmail.client-secret=${GMAIL_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:${GMAIL_OAUTH_CLIENT_SECRET:}}}
gmail.refresh-token=${GMAIL_REFRESH_TOKEN:${GOOGLE_REFRESH_TOKEN:${GMAIL_OAUTH_REFRESH_TOKEN:}}}
app.email-from=${EMAIL_FROM:${SMTP_FROM_EMAIL:${GMAIL_SENDER_EMAIL:}}}
smtp.host=${SMTP_HOST:}
smtp.port=${SMTP_PORT:587}
smtp.user=${SMTP_USER:${EMAIL_FROM:}}
smtp.pass=${SMTP_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html