<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verification</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(92vw, 560px);
      background: rgba(255,255,255,0.96);
      color: #111827;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      padding: 30px 26px;
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 1.6rem; }
    p { margin: 0 0 18px; color: #374151; }
    .status { font-weight: 600; margin-top: 12px; }
    .ok { color: #166534; }
    .err { color: #b91c1c; }
    .loader {
      margin: 18px auto 8px;
      width: 34px;
      height: 34px;
      border: 4px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Email Verification</h1>
    <p>We are validating your email address, please wait...</p>
    <div id="loader" class="loader"></div>
    <div id="status" class="status"></div>
  </main>

  <script>
    (async function () {
      const statusEl = document.getElementById("status");
      const loader = document.getElementById("loader");
      const params = new URLSearchParams(window.location.search);
      const userId = params.get("userId");
      const token = params.get("token");

      if (!userId || !token) {
        loader.style.display = "none";
        statusEl.className = "status err";
        statusEl.textContent = "Missing verification parameters.";
        return;
      }

      try {
        const res = await fetch(`/users/verify-email/${encodeURIComponent(userId)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        loader.style.display = "none";

        if (res.ok) {
          if (data.status === "already_verified") {
            statusEl.className = "status ok";
            statusEl.textContent = "Your email is already verified.";
          } else {
            statusEl.className = "status ok";
            statusEl.textContent = "Your email has been verified successfully.";
          }
          return;
        }
        statusEl.className = "status err";
        statusEl.textContent = data.message || "Email verification failed.";
      } catch (e) {
        loader.style.display = "none";
        statusEl.className = "status err";
        statusEl.textContent = "Network error while verifying email.";
      }
    })();
  </script>
</body>
</html>
